{% extends 'base.html' %}
{% block title %}Вход преподавателя{% endblock %}
{% block content %}
<div class="narrow">
  <section class="hero">
    <p class="eyebrow">Режим преподавателя</p>
    <h1>Вход в кабинет</h1>
  </section>
  <form class="card" method="post">
    <label>Пароль
      <input type="password" name="password" autocomplete="current-password" required autofocus>
    </label>
    <button class="primary" type="submit">Войти</button>
  </form>
</div>
{% endblock %}
